name: CodeQL Security Scan

on:
  workflow_call:
    inputs:
      sha:
        description: "Commit SHA to scan"
        required: true
        type: string
    outputs:
      scan_passed:
        description: "Whether security scan passed"
        value: ${{ jobs.codeql-security-scan.outputs.scan_passed }}

permissions:
  security-events: write

jobs:
  ### 🔒 CODEQL SECURITY SCAN
  codeql-security-scan:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    outputs:
      scan_passed: ${{ steps.codeql-analyze.outcome == 'success' }}
    steps:
      - name: Checkout code at release sha
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize CodeQL
        id: codeql-init
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 #v4.39.3
        with:
          languages: go
          build-mode: autobuild
          queries: security-extended

      - name: Perform CodeQL Analysis
        id: codeql-analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 #v4.39.3
        with:
          category: "/language:go"
          upload: always
