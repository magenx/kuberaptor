name: Go Format and Commit

on:
  pull_request:
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'

env:
  GO_VERSION: ${{ vars.GO_VERSION }}

permissions:
  contents: write
  pull-requests: write

jobs:
  go-format:
    name: Format Go Files and Commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Format Go Code
        run: |
          # Get the list of changed .go files in the pull request
          files=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }} | grep '\.go$') || true
          if [ -n "$files" ]; then
            echo "Formatting the following .go files: $files"
            for file in $files; do
              go fmt "./$file"
            done
          else
            echo "No Go files changed in this pull request."
          fi

      - name: Commit Changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [[ -n $(git status --porcelain) ]]; then
            git add .
            git commit -m "Apply Go file formatting"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          else
            echo "No formatting changes to commit."
          fi
        
